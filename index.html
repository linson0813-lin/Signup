<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動報名冊</title>

<style>
  :root{
    --paper: #f7f4ec;
    --paper-line: #e2dbc8;
    --ink: #1f2a24;
    --ink-soft: #4a5650;
    --margin-red: #b5493f;
    --accent: #4a5650;
    --gold: #a9822f;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    padding: 40px 20px 80px;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px;
    font-family: "Noto Serif TC", "Georgia", serif;
    color: var(--ink);
    min-height: 100vh;
  }

  .sheet{
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    padding-left: 46px;
  }

  .sheet::before{
    content:"";
    position: absolute;
    top:-20px; bottom:-20px; left: 30px;
    width: 2px;
    background: var(--margin-red);
    opacity: .55;
  }

  .masthead{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 3px double var(--ink);
    padding-bottom: 10px;
    margin-bottom: 24px;
  }
  .masthead h1{
    font-size: 22px;
    letter-spacing: 2px;
    margin: 0;
    font-weight: 600;
  }
  .masthead .tag{
    font-family: "Courier New", monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }

  .card{
    background: rgba(255,255,255,.35);
    border: 1px solid var(--paper-line);
    border-radius: 2px;
    padding: 20px 22px;
    margin-bottom: 26px;
  }

  .card h2{
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 14px;
    font-weight: 600;
  }

  label{
    display:block;
    font-family: "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  input[type=text], input[type=date], input[type=time], textarea{
    width:100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--paper-line);
    padding: 6px 2px 8px;
    margin-bottom: 16px;
    outline: none;
    resize: vertical;
  }
  input[type=text]:focus, input[type=date]:focus, input[type=time]:focus, textarea:focus{
    border-bottom: 1px solid var(--margin-red);
  }
  textarea{ min-height: 60px; }

  .field:last-child input, .field:last-child textarea{ margin-bottom: 0; }

  .save-row{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
  }

  button{
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 2px;
    padding: 9px 18px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    transition: background .15s, color .15s;
  }
  button.primary{
    background: var(--margin-red);
    border-color: var(--margin-red);
    color: #fdf9ee;
  }
  button:hover{ opacity: .82; }
  button:disabled{ opacity: .4; cursor: not-allowed; }

  .event-display{ display:none; }
  .event-display.show{ display:block; }
  .event-display h2{
    font-size: 26px;
    margin: 0 0 6px;
    letter-spacing: 1px;
  }
  .event-display .meta{
    font-family: "Courier New", monospace;
    font-size: 13px;
    color: var(--margin-red);
    margin-bottom: 6px;
  }
  .event-display .content{
    white-space: pre-wrap;
    line-height: 1.75;
    margin: 12px 0;
    font-size: 15px;
  }
  .event-display .notes{
    font-size: 13px;
    color: var(--ink-soft);
    border-top: 1px dashed var(--paper-line);
    padding-top: 10px;
    white-space: pre-wrap;
  }
  .edit-toggle{
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: var(--ink-soft);
    background:none;
    border:none;
    text-decoration: underline;
    padding: 0;
    margin-top: 14px;
    cursor:pointer;
  }

  .roster h2{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .roster h2 .count{
    color: var(--ink-soft);
    font-family: "Courier New", monospace;
    letter-spacing: 0;
    font-size: 12px;
  }

  .signup-form{
    display:flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .signup-form .field{ flex: 1 1 140px; margin-bottom: 0; }
  .signup-form input{ margin-bottom: 0; }

  ul.roster-list{ list-style: none; margin: 0; padding: 0; }
  ul.roster-list li{
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--paper-line);
  }
  ul.roster-list .num{
    font-family: "Courier New", monospace;
    color: var(--margin-red);
    font-size: 13px;
    width: 26px;
    flex-shrink:0;
  }
  ul.roster-list .who{ font-weight: 600; flex-shrink: 0; }
  ul.roster-list .note{ color: var(--ink-soft); font-size: 13px; flex: 1; }
  ul.roster-list .remove{
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: var(--paper-line);
    background:none;
    border:none;
    cursor:pointer;
    padding: 0 4px;
  }
  ul.roster-list .remove:hover{ color: var(--margin-red); }

  .empty{
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    padding: 10px 0;
  }

  .status{
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
    margin-top: 4px;
    min-height: 14px;
  }

  .config-warning{
    background: #fbeceb;
    border: 1px solid var(--margin-red);
    color: var(--margin-red);
    font-family: "Courier New", monospace;
    font-size: 12px;
    padding: 14px 16px;
    border-radius: 2px;
    margin-bottom: 24px;
    line-height: 1.7;
    display: none;
  }
  .config-warning.show{ display: block; }
  .config-warning code{
    background: rgba(0,0,0,.06);
    padding: 1px 5px;
    border-radius: 2px;
  }

  @media (max-width: 480px){
    .sheet{ padding-left: 30px; }
    .sheet::before{ left: 18px; }
    .signup-form{ flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="sheet">

  <div class="masthead">
    <h1>報　名　冊</h1>
    <span class="tag">SIGN-UP SHEET</span>
  </div>

  <div class="config-warning" id="configWarning">
    ⚠ 尚未設定 Google Apps Script：請在原始碼底部把 <code>GAS_URL</code> 換成你部署好的 Apps Script 網址，
    否則報名清單無法跨裝置共用。詳見與此檔案一起提供的 Code.gs 設定說明。
  </div>

  <!-- 活動資訊：編輯表單 -->
  <div class="card" id="eventForm">
    <h2>活動資訊</h2>
    <div class="field">
      <label>活動主題</label>
      <input type="text" id="fTitle" placeholder="例如：社區讀書會第三期">
    </div>
    <div class="field">
      <label>活動日期</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label>集合時間</label>
      <input type="time" id="fMeetTime">
    </div>
    <div class="field">
      <label>集合地點</label>
      <input type="text" id="fMeetPlace" placeholder="例如：捷運市政府站2號出口">
    </div>
    <div class="field">
      <label>活動內容</label>
      <textarea id="fContent" placeholder="活動流程、地點、注意事項..."></textarea>
    </div>
    <div class="field">
      <label>備註事項</label>
      <textarea id="fNotes" placeholder="例如：請自備筆電、限額20人"></textarea>
    </div>
    <div class="save-row">
      <button class="primary" onclick="saveEvent()">儲存活動資訊</button>
    </div>
    <div class="status" id="eventStatus"></div>
  </div>

  <!-- 活動資訊：顯示畫面 -->
  <div class="card event-display" id="eventDisplay">
    <h2 id="dTitle"></h2>
    <div class="meta" id="dDate"></div>
    <div class="meta" id="dMeet"></div>
    <div class="content" id="dContent"></div>
    <div class="notes" id="dNotes"></div>
    <button class="edit-toggle" onclick="showForm()">編輯活動資訊</button>
  </div>

  <!-- 報名清單 -->
  <div class="card roster">
    <h2><span>報名名單</span><span class="count" id="rosterCount">0 人</span></h2>
    <div class="save-row" style="margin-bottom:16px;">
      <button onclick="exportCSV()">匯出 CSV 名單</button>
    </div>

    <div class="signup-form">
      <div class="field">
        <label>姓名</label>
        <input type="text" id="sName" placeholder="您的姓名">
      </div>
      <div class="field">
        <label>附註</label>
        <input type="text" id="sNote" placeholder="選填">
      </div>
      <button class="primary" onclick="addRegistrant()">我要報名</button>
    </div>

    <ul class="roster-list" id="rosterList"></ul>
    <div class="empty" id="emptyMsg" style="display:none;">目前還沒有人報名，成為第一位吧！</div>
    <div class="status" id="rosterStatus"></div>
  </div>

</div>

<script>
/* =========================================================
   Google Apps Script 設定
   請依照 Code.gs 裡的說明部署 Web App，然後把取得的網址貼在這裡。
   例如：https://script.google.com/macros/s/AKfycb.../exec
   ========================================================= */
const GAS_URL = "https://script.google.com/macros/s/AKfycbz7Crwk0gz3cGV3v_dNfYQjQMlqF64BGojOHs5b2pVRMsWPqQuU8fmqFCWxHPD0xAEe/exec";

const isConfigured = GAS_URL && GAS_URL !== "YOUR_APPS_SCRIPT_WEB_APP_URL";
if(!isConfigured){
  document.getElementById('configWarning').classList.add('show');
}

let currentRoster = [];
let currentEventTitle = '活動報名';

async function gasGet(action){
  const res = await fetch(`${GAS_URL}?action=${action}`);
  if(!res.ok) throw new Error('網路請求失敗 (' + res.status + ')');
  return res.json();
}

async function gasPost(action, data){
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 用 text/plain 避免觸發 CORS 預檢請求
    body: JSON.stringify({ action, data })
  });
  if(!res.ok) throw new Error('網路請求失敗 (' + res.status + ')');
  return res.json();
}

function setStatus(id, msg){
  const el = document.getElementById(id);
  el.textContent = msg;
  if(msg) setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 2500);
}

function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${y}年${m}月${day}日`;
}

function fmtMeet(time, place){
  const parts = [];
  if(time) parts.push('集合時間 ' + time);
  if(place) parts.push('集合地點 ' + place);
  return parts.join('　|　');
}

function showForm(){
  document.getElementById('eventForm').style.display = 'block';
  document.getElementById('eventDisplay').classList.remove('show');
}
function showDisplay(){
  document.getElementById('eventForm').style.display = 'none';
  document.getElementById('eventDisplay').classList.add('show');
}

function applyEventInfo(info){
  currentEventTitle = info.title || '活動報名';
  document.getElementById('dTitle').textContent = info.title || '(未命名活動)';
  document.getElementById('dDate').textContent = fmtDate(info.date);
  document.getElementById('dMeet').textContent = fmtMeet(info.meetTime, info.meetPlace);
  document.getElementById('dContent').textContent = info.content || '';
  document.getElementById('dNotes').textContent = info.notes ? ('備註：' + info.notes) : '';
  document.getElementById('fTitle').value = info.title || '';
  document.getElementById('fDate').value = info.date || '';
  document.getElementById('fMeetTime').value = info.meetTime || '';
  document.getElementById('fMeetPlace').value = info.meetPlace || '';
  document.getElementById('fContent').value = info.content || '';
  document.getElementById('fNotes').value = info.notes || '';
}

async function loadEvent(){
  if(!isConfigured) return;
  try{
    const info = await gasGet('getEvent');
    if(info && info.title){
      applyEventInfo(info);
      showDisplay();
    }
  }catch(e){
    setStatus('eventStatus', '讀取失敗：' + e.message);
  }
}

async function saveEvent(){
  if(!isConfigured){ setStatus('eventStatus', '尚未設定 Google Apps Script'); return; }
  const info = {
    title: document.getElementById('fTitle').value.trim(),
    date: document.getElementById('fDate').value,
    meetTime: document.getElementById('fMeetTime').value,
    meetPlace: document.getElementById('fMeetPlace').value.trim(),
    content: document.getElementById('fContent').value.trim(),
    notes: document.getElementById('fNotes').value.trim()
  };
  if(!info.title){
    setStatus('eventStatus', '請至少填寫活動主題');
    return;
  }
  try{
    await gasPost('saveEvent', info);
    applyEventInfo(info);
    setStatus('eventStatus', '已儲存');
    showDisplay();
  }catch(e){
    setStatus('eventStatus', '儲存失敗：' + e.message);
  }
}

function renderRoster(list){
  currentRoster = list;
  const ul = document.getElementById('rosterList');
  const empty = document.getElementById('emptyMsg');
  document.getElementById('rosterCount').textContent = list.length + ' 人';
  ul.innerHTML = '';
  if(list.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.forEach((r, idx) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <span class="num">${String(idx+1).padStart(2,'0')}</span>
      <span class="who"></span>
      <span class="note"></span>
      <button class="remove" title="移除">✕</button>
    `;
    li.querySelector('.who').textContent = r.name;
    li.querySelector('.note').textContent = r.note || '';
    li.querySelector('.remove').onclick = () => removeRegistrant(r.id);
    ul.appendChild(li);
  });
}

async function loadRoster(){
  if(!isConfigured) return;
  try{
    const list = await gasGet('getRegistrants');
    renderRoster(list || []);
  }catch(e){
    setStatus('rosterStatus', '讀取失敗：' + e.message);
  }
}

async function addRegistrant(){
  if(!isConfigured){ setStatus('rosterStatus', '尚未設定 Google Apps Script'); return; }
  const nameInput = document.getElementById('sName');
  const noteInput = document.getElementById('sNote');
  const name = nameInput.value.trim();
  const note = noteInput.value.trim();

  if(!name){
    setStatus('rosterStatus', '請輸入姓名');
    return;
  }

  try{
    await gasPost('addRegistrant', { name, note });
    nameInput.value = '';
    noteInput.value = '';
    setStatus('rosterStatus', '報名成功');
    await loadRoster();
  }catch(e){
    setStatus('rosterStatus', '報名失敗：' + e.message);
  }
}

async function removeRegistrant(id){
  if(!isConfigured) return;
  try{
    await gasPost('deleteRegistrant', { id });
    await loadRoster();
  }catch(e){
    setStatus('rosterStatus', '移除失敗：' + e.message);
  }
}

function csvEscape(v){
  const s = (v ?? '').toString();
  if(/[",\n]/.test(s)){
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportCSV(){
  if(currentRoster.length === 0){
    setStatus('rosterStatus', '目前沒有報名資料可匯出');
    return;
  }
  const header = ['編號','姓名','附註','報名時間'];
  const rows = currentRoster.map((r, idx) => [
    idx + 1,
    r.name,
    r.note || '',
    r.time ? new Date(r.time).toLocaleString('zh-TW') : ''
  ]);

  const csvContent = [header, ...rows]
    .map(row => row.map(csvEscape).join(','))
    .join('\r\n');

  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentEventTitle}_報名名單.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  setStatus('rosterStatus', '已匯出 CSV');
}

loadEvent();
loadRoster();

// 每 5 秒輪詢一次，讓不同人看到彼此最新的報名狀況（Apps Script 無法像 Firebase 一樣即時推播）
if(isConfigured){
  setInterval(loadRoster, 5000);
  setInterval(loadEvent, 8000);
}
</script>

</body>
</html>
